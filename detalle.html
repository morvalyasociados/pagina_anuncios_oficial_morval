<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de propiedad — MorVal y Asociados</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="index.html" class="navbar-brand">
            <span class="icon">🏡</span> MorVal
        </a>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Propiedades</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="contacto.html" class="btn-contact-nav">Contáctanos</a></li>
        </ul>
        <button class="menu-toggle" id="menuToggle" aria-label="Menú">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main class="page-content">
        <div class="detail-container" id="detailContainer">
            <div class="detail-gallery" id="detailGallery">
                <div class="gallery-main">
                    <button id="detailPrev" class="carousel-btn carousel-prev" aria-label="Anterior">‹</button>
                    <img id="detailImage" class="detail-image" src="" alt="Imagen de la casa">
                    <button id="detailNext" class="carousel-btn carousel-next" aria-label="Siguiente">›</button>
                </div>
                <div class="gallery-thumbs" id="detailThumbs" aria-label="Miniaturas de imágenes"></div>
            </div>
            <span id="detailBadge" class="detail-badge"></span>
            <h1 id="detailTitle" class="detail-title"></h1>
            <p id="detailLocation" class="detail-location"></p>
            <p id="detailPrice" class="detail-price"></p>
            <div id="detailFeatures" class="detail-features"></div>
            <p id="detailDescription" class="detail-description"></p>
            <div id="detailGrid" class="detail-grid"></div>
            <a href="contacto.html" class="btn btn-primary">Me interesa esta propiedad</a>
        </div>
    </main>

    <footer class="footer">
        © 2026 MorVal y Asociados. Asesoría Inmobiliaria.
    </footer>

    <script src="script.js"></script>
    <!-- Lightbox modal for full-size images -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button id="lightboxClose" class="lightbox-close" aria-label="Cerrar">×</button>
        <button id="lightboxPrev" class="lightbox-nav prev" aria-label="Anterior">‹</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Imagen ampliada">
        </div>
        <button id="lightboxNext" class="lightbox-nav next" aria-label="Siguiente">›</button>
    </div>
</body>
</html>
